name: Fork setup
description: >-
  Install the Herdr build toolchain for fork workflows: Rust from
  rust-toolchain.toml, Zig at a stable path, and optionally just and
  cargo-nextest, Bun, and build caches.

inputs:
  targets:
    description: Additional Rust targets, comma-separated.
    required: false
    default: ""
  components:
    description: Rust components, comma-separated.
    required: false
    default: rustfmt,clippy
  tools:
    description: Tools for taiki-e/install-action, comma-separated. Empty skips the step.
    required: false
    default: ""
  bun:
    description: Install Bun when set to "true".
    required: false
    default: "false"
  cargo-cache-key:
    description: Swatinem/rust-cache key. Empty disables the cargo cache.
    required: false
    default: ""
  zig-cache-key:
    description: >-
      Key prefix for the workspace .zig-cache directory. Empty disables it.
      Callers that enable it must point ZIG_GLOBAL_CACHE_DIR and
      ZIG_LOCAL_CACHE_DIR at that directory.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read Rust toolchain
      id: toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "::error file=rust-toolchain.toml::could not read the toolchain channel"
          exit 1
        fi
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Install Rust
      uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
      with:
        toolchain: ${{ steps.toolchain.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Install Rust tools
      if: inputs.tools != ''
      uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
      with:
        tool: ${{ inputs.tools }}

    - name: Install Bun
      if: inputs.bun == 'true'
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version: 1.3.14

    - name: Install Zig
      if: runner.os != 'Windows' || runner.arch != 'ARM64'
      uses: vercel-labs/setup-zig@83c1594f26b86da8a9a8ddd9b5ee5f3af0f96943 # v1.0.2
      with:
        version: 0.16.0

    # Zig's C-header cache keys include the compiler installation path.
    - name: Stabilize Zig installation path on Unix
      if: runner.os != 'Windows'
      shell: bash
      run: |
        stable_zig="$RUNNER_TEMP/herdr-zig-0.16.0"
        mv "$(dirname "$(command -v zig)")" "$stable_zig"
        echo "$stable_zig" >> "$GITHUB_PATH"
        echo "ZIG=$stable_zig/zig" >> "$GITHUB_ENV"

    - name: Stabilize Zig installation path on Windows
      if: runner.os == 'Windows' && runner.arch != 'ARM64'
      shell: pwsh
      run: |
        $source = Split-Path (Get-Command zig).Source
        $stable = Join-Path $env:RUNNER_TEMP "herdr-zig-0.16.0"
        Move-Item -LiteralPath $source -Destination $stable
        $stable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "ZIG=$(Join-Path $stable 'zig.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    # Zig 0.16.0's native Windows ARM64 compiler crashes; x64 Zig can cross-compile ARM64.
    - name: Install x64 Zig on Windows ARM64
      if: runner.os == 'Windows' && runner.arch == 'ARM64'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $archive = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0.zip"
        $url = "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip"
        $expectedSha256 = "68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e"
        Invoke-WebRequest -Uri $url -OutFile $archive
        $actualSha256 = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash
        if ($actualSha256 -ne $expectedSha256) {
          throw "Zig 0.16.0 checksum mismatch: expected $expectedSha256, got $actualSha256"
        }
        Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
        $source = Join-Path $env:RUNNER_TEMP "zig-x86_64-windows-0.16.0"
        $stable = Join-Path $env:RUNNER_TEMP "herdr-zig-0.16.0"
        Move-Item -LiteralPath $source -Destination $stable
        $stable | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        "ZIG=$(Join-Path $stable 'zig.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        $version = (& (Join-Path $stable "zig.exe") version | Out-String).Trim()
        if ($LASTEXITCODE -ne 0 -or $version -ne "0.16.0") {
          throw "The x64 Zig executable did not start correctly on Windows ARM64: $version"
        }

    - name: Restore Zig build cache
      if: inputs.zig-cache-key != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .zig-cache
        key: ${{ inputs.zig-cache-key }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ inputs.zig-cache-key }}-

    - name: Restore cargo cache
      if: inputs.cargo-cache-key != ''
      uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      with:
        cache-bin: false
        key: ${{ inputs.cargo-cache-key }}
