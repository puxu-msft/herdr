name: Fork CI

on:
  push:
    branches: ["**"]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commit-lint:
    # Same-repository pull requests are already covered by their branch push.
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/conventional_commits.py "$PR_TITLE"

      # Merge commits are exempt: upstream syncs use `merge: sync upstream master`.
      - name: Validate pushed commit subjects
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          elif [ "$BRANCH" != "$DEFAULT_BRANCH" ]; then
            range="origin/$DEFAULT_BRANCH..$AFTER"
          else
            range="$AFTER^!"
          fi
          subjects="$(git log --no-merges --format=%s "$range")"
          if [ -z "$subjects" ]; then
            echo "No non-merge commits in $range."
            exit 0
          fi
          mapfile -t subject_list <<< "$subjects"
          echo "Checking ${#subject_list[@]} commit subject(s) in $range."
          python3 scripts/conventional_commits.py "${subject_list[@]}"

  checks:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/fork-checks.yml
